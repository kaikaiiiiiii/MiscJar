name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在于远程，例如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- 准备
  prepare:
    name: 校验版本并创建草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验 tag 与 package.json 版本一致
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须形如 v1.2.3，当前为 $RELEASE_TAG" >&2
            exit 1
          fi
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "tag $RELEASE_TAG 与 package.json 的 version $version 不一致" >&2
            exit 1
          fi

      - name: 创建草稿 Release（已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，构建完成后更新资产"
          else
            gh release create "$RELEASE_TAG" --draft --title "谜罐 MiscJar $RELEASE_TAG" --generate-notes --verify-tag
          fi

  # ---------------------------------------------------------------- 六平台构建
  build:
    name: 打包 ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            asset: windows-x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            asset: windows-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset: macos-x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset: macos-arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json

      - name: 安装 Linux 运行依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgbm1 libgtk-3-0t64

      - name: 安装 CLI 依赖
        run: npm ci

      - name: 安装 GUI 依赖
        run: npm ci
        working-directory: gui

      - name: 准备随包资源（codec.js / zipentry.js / 插画）
        run: node prepare-assets.js
        working-directory: gui

      - name: 聚合测试（Linux 走虚拟显示）
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: 聚合测试
        if: runner.os != 'Linux'
        run: npm test

      - name: 打包 ${{ matrix.asset }}
        run: node make-package.js ${{ matrix.platform }} ${{ matrix.arch }}
        working-directory: gui

      - name: 验收打包产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "gui\dist\MiscJar-${{ matrix.platform }}-${{ matrix.arch }}\MiscJar.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "打包版 selftest 退出码 $($proc.ExitCode)" }
          node test/check-selftest.js

      - name: 验收打包产物（macOS）
        if: runner.os == 'macOS'
        run: |
          "gui/dist/MiscJar-${{ matrix.platform }}-${{ matrix.arch }}/MiscJar.app/Contents/MacOS/MiscJar" --selftest
          node test/check-selftest.js

      - name: 验收打包产物（Linux）
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "gui/dist/MiscJar-${{ matrix.platform }}-${{ matrix.arch }}/MiscJar" --selftest
          node test/check-selftest.js

      - name: 生成压缩包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "MiscJar-$env:RELEASE_TAG-${{ matrix.asset }}.zip"
          Compress-Archive -Path "gui\dist\MiscJar-${{ matrix.platform }}-${{ matrix.arch }}" -DestinationPath $asset -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -Path "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt" -Encoding ascii

      - name: 生成压缩包（macOS）
        if: runner.os == 'macOS'
        run: |
          asset="MiscJar-${RELEASE_TAG}-${{ matrix.asset }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "gui/dist/MiscJar-${{ matrix.platform }}-${{ matrix.arch }}" "$asset"
          shasum -a 256 "$asset" > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt"

      - name: 生成压缩包（Linux）
        if: runner.os == 'Linux'
        run: |
          asset="MiscJar-${RELEASE_TAG}-${{ matrix.asset }}.tar.gz"
          tar -czf "$asset" -C gui/dist "MiscJar-${{ matrix.platform }}-${{ matrix.arch }}"
          sha256sum "$asset" > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt"

      - name: 上传资产到 Release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG "MiscJar-$env:RELEASE_TAG-${{ matrix.asset }}.zip" --repo $env:GITHUB_REPOSITORY --clobber

      - name: 上传资产到 Release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ext=tar.gz
          else
            ext=zip
          fi
          gh release upload "$RELEASE_TAG" "MiscJar-${RELEASE_TAG}-${{ matrix.asset }}.$ext" --repo "$GITHUB_REPOSITORY" --clobber

      - name: 暂存校验和（供汇总）
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}
          path: SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------- 汇总并发布
  publish:
    name: 汇总校验和并发布 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下载各平台校验和
        uses: actions/download-artifact@v8
        with:
          pattern: SHA256SUMS-*
          merge-multiple: true
          path: sums

      - name: 合并 SHA256SUMS 并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat sums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          wc -l SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
