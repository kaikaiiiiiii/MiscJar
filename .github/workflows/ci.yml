name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 六个原生平台：测试 + 打包 + 打包版 selftest，与 Release 使用同一套目标
  build:
    name: 构建 ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            asset: windows-x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            asset: windows-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset: macos-x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset: macos-arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json

      - name: 安装 Linux 运行依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgbm1 libgtk-3-0t64

      - name: 安装 CLI 依赖
        run: npm ci

      - name: 安装 GUI 依赖
        run: npm ci
        working-directory: gui

      - name: 准备随包资源（codec.js / zipentry.js / 插画）
        run: node prepare-assets.js
        working-directory: gui

      - name: 聚合测试（Linux 走虚拟显示）
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: 聚合测试
        if: runner.os != 'Linux'
        run: npm test

      - name: 打包 ${{ matrix.asset }}
        run: node make-package.js ${{ matrix.platform }} ${{ matrix.arch }}
        working-directory: gui

      - name: 验收打包产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "gui\dist\MiscJar-${{ matrix.platform }}-${{ matrix.arch }}\MiscJar.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "打包版 selftest 退出码 $($proc.ExitCode)" }
          node test/check-selftest.js

      - name: 验收打包产物（macOS）
        if: runner.os == 'macOS'
        run: |
          "gui/dist/MiscJar-${{ matrix.platform }}-${{ matrix.arch }}/MiscJar.app/Contents/MacOS/MiscJar" --selftest
          node test/check-selftest.js

      - name: 验收打包产物（Linux）
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "gui/dist/MiscJar-${{ matrix.platform }}-${{ matrix.arch }}/MiscJar" --selftest
          node test/check-selftest.js
